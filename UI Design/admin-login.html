
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOAH'S ARK | Administrator Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        forest: {
                            950: '#07100d',
                            900: '#0b211b',
                            800: '#14372D',
                            700: '#1b4d3e'
                        },
                        gold: {
                            DEFAULT: '#D4AF37',
                            light: '#E8D7A7',
                            dark: '#AA8C2C'
                        }
                    },
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(45, 131, 95, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(212, 175, 55, 0.08),
                    transparent 40%
                ),
                #07100d;
            color: #f7f5ec;
            min-height: 100vh;
        }

        .glass {
            background: rgba(14, 38, 30, 0.82);
            border: 1px solid rgba(212, 175, 55, 0.18);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        input {
            outline: none;
        }

        input:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.10);
        }

        button {
            transition: all 0.25s ease;
        }

        .gold-text {
            background: linear-gradient(
                120deg,
                #D4AF37,
                #F1E4B5,
                #AA8C2C
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-5 py-12">

    <main class="w-full max-w-md">

        <!-- BRAND -->
        <div class="text-center mb-9">

            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl border border-gold/30 bg-gold/10 mb-5">

                <i
                    data-lucide="graduation-cap"
                    class="w-8 h-8 text-gold"
                ></i>

            </div>

            <h1 class="font-display text-3xl sm:text-4xl font-semibold gold-text">
                NOAH'S ARK
            </h1>

            <p class="text-xs tracking-[0.28em] uppercase text-white/50 mt-3">
                International School of Hospitality & Tourism
            </p>

        </div>


        <!-- LOGIN CARD -->
        <section class="glass rounded-3xl p-7 sm:p-9">

            <div class="mb-8">

                <p class="text-gold text-xs uppercase tracking-[0.2em] font-semibold mb-3">
                    Secure Administration
                </p>

                <h2 class="font-display text-3xl font-semibold">
                    Welcome Back
                </h2>

                <p class="text-sm text-white/50 mt-2 leading-6">
                    Sign in to access your executive administration dashboard.
                </p>

            </div>


            <!-- ERROR / SUCCESS MESSAGE -->
            <div
                id="loginMessage"
                class="hidden rounded-xl px-4 py-3 text-sm mb-5"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- LOGIN FORM -->
            <form id="adminLoginForm" class="space-y-5">

                <div>

                    <label
                        for="email"
                        class="block text-sm font-medium text-white/80 mb-2"
                    >
                        Administrator Email
                    </label>

                    <div class="relative">

                        <i
                            data-lucide="mail"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gold/70"
                        ></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="username"
                            required
                            class="w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pl-11 pr-4 text-sm text-white placeholder:text-white/30"
                        >

                    </div>

                </div>


                <div>

                    <label
                        for="password"
                        class="block text-sm font-medium text-white/80 mb-2"
                    >
                        Password
                    </label>

                    <div class="relative">

                        <i
                            data-lucide="lock"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gold/70"
                        ></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            class="w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pl-11 pr-12 text-sm text-white placeholder:text-white/30"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-gold"
                            aria-label="Show password"
                        >
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="w-full bg-gold hover:bg-gold-light text-forest-950 font-bold rounded-xl py-4 flex items-center justify-center gap-2 shadow-lg shadow-gold/10"
                >
                    <span id="loginButtonText">Sign In Securely</span>

                    <i
                        data-lucide="arrow-right"
                        class="w-4 h-4"
                    ></i>
                </button>

            </form>


            <div class="flex items-center gap-3 my-7">

                <div class="h-px bg-white/10 flex-1"></div>

                <span class="text-xs text-white/30 uppercase tracking-widest">
                    Protected Access
                </span>

                <div class="h-px bg-white/10 flex-1"></div>

            </div>


            <div class="flex items-center justify-center gap-2 text-xs text-white/40">

                <i
                    data-lucide="shield-check"
                    class="w-4 h-4 text-gold/70"
                ></i>

                Authorized administrators only

            </div>

        </section>


        <!-- FOOTER -->
        <footer class="text-center mt-8">

            <p class="text-xs text-white/35">
                © 2026 Noah's Ark International School.
            </p>

            <p class="text-xs text-white/25 mt-2">
                Secure Administration Portal
            </p>

        </footer>

    </main>


    <!-- AUTHENTICATION JAVASCRIPT -->
    <script src="../JS/AdminAuth.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
